<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职途洞察流程智能体</title>
  <script src="/static/echarts.min.js"></script>
  <script>
    // 本地 echarts 加载失败（如文件缺失）时回退 CDN
    if (typeof echarts === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"><\/script>');
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #20242c;
      --muted: #687080;
      --line: #dde2ea;
      --primary: #1f6feb;
      --success: #16833a;
      --warning: #a65f00;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #111827;
      color: white;
      padding: 22px 28px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }
    header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
    }
    .toolbar, .grid, .charts {
      display: grid;
      gap: 14px;
    }
    .toolbar {
      grid-template-columns: 1fr auto auto;
      align-items: center;
      margin-bottom: 14px;
    }
    .status-line {
      color: var(--muted);
      font-size: 14px;
    }
    button {
      border: 1px solid var(--primary);
      border-radius: 6px;
      background: var(--primary);
      color: white;
      height: 38px;
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary {
      background: white;
      color: var(--primary);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 14px;
    }
    .charts {
      grid-template-columns: 1fr 1fr;
      margin-bottom: 14px;
    }
    section, .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .metric strong {
      display: block;
      font-size: 26px;
      line-height: 1.2;
    }
    .metric span {
      color: var(--muted);
      font-size: 13px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }
    .chart {
      width: 100%;
      height: 320px;
    }
    .report {
      line-height: 1.68;
      font-size: 15px;
    }
    .report.empty {
      color: var(--muted);
    }
    .report h1, .report h2, .report h3, .report h4 {
      margin: 18px 0 10px;
      line-height: 1.35;
    }
    .report h1 {
      font-size: 24px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .report h2 { font-size: 20px; }
    .report h3 { font-size: 17px; }
    .report h4 { font-size: 15px; }
    .report p {
      margin: 8px 0;
    }
    .report ul, .report ol {
      margin: 8px 0;
      padding-left: 24px;
    }
    .report li {
      margin: 5px 0;
    }
    .report table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 14px;
    }
    .report th, .report td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .report th {
      background: #f3f6fb;
    }
    .report code {
      padding: 1px 5px;
      border-radius: 4px;
      background: #eef2f7;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }
    .report hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 16px 0;
    }
    .steps {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .steps th, .steps td {
      border-bottom: 1px solid var(--line);
      padding: 9px;
      text-align: left;
      vertical-align: top;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #243b76;
      font-size: 12px;
    }
    .succeeded { color: var(--success); }
    .warning { color: var(--warning); }
    .failed { color: var(--danger); }
    .running { color: var(--primary); }
    .schedule {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }
    input[type="time"] {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }
    @media (max-width: 900px) {
      .toolbar, .grid, .charts {
        grid-template-columns: 1fr;
      }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>职途洞察流程智能体</h1>
    <p>采集、清洗、分析、AI 报告生成和网页展示的一体化控制台</p>
  </header>
  <main>
    <div class="toolbar">
      <div class="status-line" id="statusLine">正在加载状态...</div>
      <button id="runButton" type="button">运行智能体</button>
      <button class="secondary" id="refreshButton" type="button">刷新</button>
    </div>

    <section style="margin-bottom:14px">
      <h2>定时调度</h2>
      <div class="schedule">
        <label><input type="checkbox" id="scheduleEnabled"> 启用每天自动运行</label>
        <label for="scheduleTime">运行时间</label>
        <input type="time" id="scheduleTime" value="09:00" title="每天自动运行的时间">
        <button class="secondary" id="saveScheduleButton" type="button">保存调度</button>
        <span id="scheduleTip"></span>
      </div>
    </section>

    <div class="grid">
      <div class="metric"><strong id="totalJobs">0</strong><span>分析岗位数</span></div>
      <div class="metric"><strong id="avgSalary">-</strong><span>平均薪资 K/月</span></div>
      <div class="metric"><strong id="cityCount">0</strong><span>覆盖城市</span></div>
      <div class="metric"><strong id="skillCount">0</strong><span>识别技能</span></div>
    </div>

    <div class="charts">
      <section>
        <h2>城市薪资</h2>
        <div id="cityChart" class="chart"></div>
      </section>
      <section>
        <h2>技能热度</h2>
        <div id="skillChart" class="chart"></div>
      </section>
    </div>

    <section style="margin-bottom:14px">
      <h2>运行步骤</h2>
      <table class="steps">
        <thead>
          <tr><th>步骤</th><th>状态</th><th>说明</th><th>完成时间</th></tr>
        </thead>
        <tbody id="stepsBody"></tbody>
      </table>
    </section>

    <section>
      <h2>AI 分析报告</h2>
      <div class="report" id="reportBox">暂无报告，点击“运行智能体”生成。</div>
    </section>
  </main>

  <script>
    const cityChart = echarts.init(document.getElementById("cityChart"));
    const skillChart = echarts.init(document.getElementById("skillChart"));
    const runButton = document.getElementById("runButton");
    const refreshButton = document.getElementById("refreshButton");
    const saveScheduleButton = document.getElementById("saveScheduleButton");

    function formatStatus(run, running) {
      if (running) return "智能体正在运行...";
      if (!run) return "还没有运行记录";
      return `最近运行 #${run.id}：${run.status}，${run.message || ""}`;
    }

    function renderCharts(data) {
      const cityRows = data.analysis.city_salary || [];
      cityChart.setOption({
        tooltip: { trigger: "axis" },
        grid: { left: 46, right: 20, top: 28, bottom: 50 },
        xAxis: { type: "category", data: cityRows.map(row => row.city) },
        yAxis: { type: "value", name: "K/月" },
        series: [{ type: "bar", data: cityRows.map(row => row.avg_salary || 0), itemStyle: { color: "#1f6feb" } }]
      });

      const skillRows = data.analysis.skill_hotness || [];
      skillChart.setOption({
        tooltip: { trigger: "axis" },
        grid: { left: 46, right: 20, top: 28, bottom: 50 },
        xAxis: { type: "category", data: skillRows.slice(0, 10).map(row => row.skill) },
        yAxis: { type: "value", name: "岗位数" },
        series: [{ type: "bar", data: skillRows.slice(0, 10).map(row => row.job_count), itemStyle: { color: "#16a34a" } }]
      });
    }

    function renderSteps(steps) {
      const body = document.getElementById("stepsBody");
      body.innerHTML = "";
      if (!steps || steps.length === 0) {
        body.innerHTML = '<tr><td colspan="4">暂无步骤记录</td></tr>';
        return;
      }
      for (const step of steps) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(step.step_name)}</td>
          <td class="${escapeHtml(step.status)}">${escapeHtml(step.status)}</td>
          <td>${escapeHtml(step.detail || "")}</td>
          <td>${escapeHtml(step.finished_at || "")}</td>
        `;
        body.appendChild(tr);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderInlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>");
    }

    function tableCells(line) {
      let text = line.trim();
      if (text.startsWith("|")) text = text.slice(1);
      if (text.endsWith("|")) text = text.slice(0, -1);
      return text.split("|").map(cell => cell.trim());
    }

    function isTableSeparator(line) {
      const cells = tableCells(line);
      return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let paragraph = [];
      let listType = "";

      function flushParagraph() {
        if (paragraph.length === 0) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function closeList() {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = "";
      }

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index].trimEnd();
        const trimmed = line.trim();

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        if (trimmed.startsWith("|") && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
          flushParagraph();
          closeList();
          const headers = tableCells(trimmed);
          const rows = [];
          index += 2;
          while (index < lines.length && lines[index].trim().startsWith("|")) {
            rows.push(tableCells(lines[index]));
            index += 1;
          }
          index -= 1;

          html.push("<table><thead><tr>");
          for (const header of headers) html.push(`<th>${renderInlineMarkdown(header)}</th>`);
          html.push("</tr></thead><tbody>");
          for (const row of rows) {
            html.push("<tr>");
            for (const cell of row) html.push(`<td>${renderInlineMarkdown(cell)}</td>`);
            html.push("</tr>");
          }
          html.push("</tbody></table>");
          continue;
        }

        if (/^-{3,}$/.test(trimmed)) {
          flushParagraph();
          closeList();
          html.push("<hr>");
          continue;
        }

        const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const unordered = trimmed.match(/^[-*]\s+(.+)$/);
        const ordered = trimmed.match(/^\d+\.\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          const nextType = unordered ? "ul" : "ol";
          if (listType !== nextType) {
            closeList();
            html.push(`<${nextType}>`);
            listType = nextType;
          }
          html.push(`<li>${renderInlineMarkdown((unordered || ordered)[1])}</li>`);
          continue;
        }

        paragraph.push(trimmed);
      }

      flushParagraph();
      closeList();
      return html.join("");
    }

    // 轮询去重：记录最近一次运行的标识，只有变化时才拉取全量看板数据
    let lastRunKey = "";

    function runKeyOf(run, running) {
      return run ? `${run.id}:${run.status}:${running}` : `none:${running}`;
    }

    async function loadDashboard() {
      const response = await fetch("/api/dashboard");
      const data = await response.json();
      document.getElementById("statusLine").textContent = formatStatus(data.latest_run, data.running);
      runButton.disabled = data.running;
      document.getElementById("totalJobs").textContent = data.metrics.total_jobs || 0;
      document.getElementById("avgSalary").textContent = data.metrics.avg_salary || "-";
      document.getElementById("cityCount").textContent = (data.analysis.city_salary || []).length;
      document.getElementById("skillCount").textContent = (data.analysis.skill_hotness || []).length;
      document.getElementById("scheduleEnabled").checked = Boolean(data.schedule.enabled);
      document.getElementById("scheduleTime").value = data.schedule.daily_time || "09:00";

      const report = data.latest_report && data.latest_report.report_markdown;
      const reportBox = document.getElementById("reportBox");
      if (report) {
        reportBox.classList.remove("empty");
        reportBox.innerHTML = renderMarkdown(report);
      } else {
        reportBox.classList.add("empty");
        reportBox.textContent = "暂无报告，点击“运行智能体”生成。";
      }
      renderCharts(data);
      renderSteps(data.latest_steps || []);
      lastRunKey = runKeyOf(data.latest_run, data.running);
    }

    async function pollStatus() {
      try {
        const response = await fetch("/api/agent/status");
        const data = await response.json();
        document.getElementById("statusLine").textContent = formatStatus(data.latest_run, data.running);
        runButton.disabled = data.running;
        renderSteps(data.steps || []);
        const key = runKeyOf(data.latest_run, data.running);
        if (key !== lastRunKey) {
          await loadDashboard();
        }
      } catch (err) {
        // 网络抖动时等下个周期重试
      }
    }

    runButton.addEventListener("click", async () => {
      runButton.disabled = true;
      await fetch("/api/agent/run", { method: "POST" });
      await loadDashboard();
    });

    refreshButton.addEventListener("click", loadDashboard);

    saveScheduleButton.addEventListener("click", async () => {
      const enabled = document.getElementById("scheduleEnabled").checked;
      const daily_time = document.getElementById("scheduleTime").value || "09:00";
      const response = await fetch("/api/agent/schedule", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled, daily_time })
      });
      document.getElementById("scheduleTip").textContent = response.ok ? "已保存" : "保存失败";
      await loadDashboard();
    });

    window.addEventListener("resize", () => {
      cityChart.resize();
      skillChart.resize();
    });

    loadDashboard();
    setInterval(pollStatus, 10000);
  </script>
</body>
</html>
